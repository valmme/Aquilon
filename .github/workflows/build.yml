name: Build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            cmake g++ ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libfreetype-dev libxss-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare dist (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ -f build/Release/Aquilon ]; then cp build/Release/Aquilon dist/; elif [ -f build/Aquilon ]; then cp build/Aquilon dist/; fi
          cp -r resources dist/ || true

      - name: Prepare dist (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path build\Release\Aquilon.exe) { Copy-Item -Path build\Release\Aquilon.exe -Destination dist\ -Force }
          elseif (Test-Path build\Aquilon.exe) { Copy-Item -Path build\Aquilon.exe -Destination dist\ -Force }
          Get-ChildItem -Path build\Release -Filter *.dll -File -ErrorAction SilentlyContinue | Copy-Item -Destination dist\ -Force
          if (Test-Path resources) { Copy-Item -Recurse -Force -Path resources -Destination dist\resources }

      - name: Prepare dist (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          if [ -f build/Release/Aquilon ]; then cp build/Release/Aquilon dist/; elif [ -f build/Aquilon ]; then cp build/Aquilon dist/; fi
          cp -r resources dist/ || true
          cp build/Release/*.so dist/ 2>/dev/null || true
          cp build/Release/*.dylib dist/ 2>/dev/null || true

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: aquilon-build-${{ matrix.os }}
          path: dist
